components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Optional alternative — JWT access token short-lived ≤15min in memory (not localStorage) + rotating refresh token in HttpOnly Secure SameSite cookie with reuse detection revoking all sessions on reuse.
        Explicit prohibition: never store long-lived refresh/access tokens in localStorage/sessionStorage.
        When using bearer, Authorization header Bearer not auto-sent cross-origin, intrinsically CSRF-resistant, but still need XSS protections and HttpOnly refresh.
        Marked proposed/conditional requiring Phase04 validation. Recommended MVP is cookieAuth.
        Frontend MUST NEVER access Secrets Manager — private secrets only backend/worker via server-side injection.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Recommended MVP — HttpOnly; Secure; SameSite=Lax session cookie per ADR-032 corrected.
        HttpOnly true (JS inaccessible prevents XSS theft), Secure true (HTTPS only), SameSite=Lax (CSRF mitigation, balances usability).
        No long-lived tokens in localStorage/sessionStorage — explicit prohibition.
        CSRF strategy: double-submit token or Django CSRF middleware — frontend reads csrftoken cookie (readable) and sends X-CSRFToken header for state-changing mutations.
        Frontend/backend trust boundary: browser untrusted, backend authoritative.
        Frontend MUST NEVER access Secrets Manager directly — only public NEXT_PUBLIC_* runtime config.

  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization tenant ID — must match active org derived from server context, else 404/403

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing/invalid auth — 401 + save form state to session storage redirect /login
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller lacks role or object-level assignment — 403 or 404 for cross-tenant obscurity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found or belongs to other tenant — 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Unique constraint violation (slug, email) — 409
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit breached — 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: RFC7807 type URI
          example: https://api.coachos.example.com/errors/permission_denied
        title:
          type: string
          example: Permission Denied
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: You do not possess an active assignment for this athlete.
        instance:
          type: string
          format: uri
          example: /api/v1/athletes/019f.../progress/photos
        message_key:
          type: string
          description: Localized message key extension for frontend i18n
          example: errors.authz.unassigned_athlete
        field_errors:
          type: object
          additionalProperties:
            type: string
          description: Field-level validation errors

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          example: coach.reza@example.com
        password:
          type: string
          minLength: 8
          example: SecurePassword123!
        display_name:
          type: string
          minLength: 2
          example: Reza Rahimi
        preferred_locale:
          type: string
          enum: [fa-IR, en-US]
        invitation_token:
          type: string
          description: Optional invitation token from email link

    LoginRequest:
