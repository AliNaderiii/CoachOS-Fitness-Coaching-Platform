openapi: 3.1.0
info:
  title: CoachOS API
  description: |
    Provisional OpenAPI 3.1 specification for CoachOS B2B2C fitness coaching platform — P0 MVP (Correction Phase 03 review).
    Covers authentication, organizations, memberships, invitations, exercise catalog, moderation, programs, templates, assignments, athlete Today view, workout sessions, set logs, feedback flags, progress metrics/photos, messages, notifications, audit events, privacy export/deletion.
    This file is a specification artifact only — not implemented in Phase 03. Requires implementation review in Phase 04. Remains provisional until Phase 04 validation.

    **Authentication Transport Consistency — Corrected (ADR-032):**
    - **Recommended MVP Strategy:** HttpOnly/Secure/SameSite cookie sessions (Django sessionid):
      - HttpOnly true (JS inaccessible, prevents XSS theft), Secure true (HTTPS only), SameSite=Lax (CSRF mitigation, Lax balances usability vs Strict).
      - No long-lived tokens in localStorage/sessionStorage — explicit prohibition.
      - CSRF strategy for cookie-based mutations: double-submit token or Django CSRF middleware — frontend reads csrftoken cookie (non-HttpOnly readable) and sends X-CSRFToken header for POST/PATCH/DELETE, backend verifies, SameSite=Lax additional layer.
      - Frontend/backend trust boundary: browser untrusted, backend authoritative, all auth checks server-side.
    - **Optional Alternative (Bearer/JWT):** If bearer/JWT retained:
      - Short-lived access ≤15min in memory (not localStorage), rotating refresh in HttpOnly Secure SameSite cookie with reuse detection revoking all sessions on reuse.
      - Explicit prohibition: never store long-lived refresh/access tokens in localStorage/sessionStorage.
      - When using bearer, Authorization header Bearer not auto-sent cross-origin, intrinsically CSRF-resistant, but still need XSS protections and HttpOnly refresh.
    - **Final Choice for First Implementation:** Cookie sessions (simpler, Django built-in). JWT alternative remains optional, marked proposed/conditional requiring Phase 04 validation. Both schemes documented but recommendation clear.

    **Secrets Boundary Correction:**
    - Frontend MUST NEVER access Secrets Manager directly — private secrets (DB URLs, Django SECRET_KEY, Redis/S3 credentials, email API keys, JWT signing keys) only to backend/worker via server-side injection. Frontend only public NEXT_PUBLIC_* runtime config. FE --> SecretMgr forbidden and removed from diagrams.

    **CSP Correction:**
    - Production preferred nonce/hash-based script-src (script-src 'self' 'nonce-{random}' 'strict-dynamic' https:), no unsafe-inline as accepted production control. Temporary unsafe-inline exception during Phase04 if framework requires, marked temporary with risk and hardening task TODO-CSP-001, not finalized before validation.

    Languages: Persian fa-IR RTL + English en-US LTR only. Arabic out of scope. No payment/AI/wearable endpoints as P0 implemented.
    Error model: RFC7807 compatible + message_key extension for localized frontend messages.

    **OpenAPI Validity:** YAML parses successfully, OpenAPI 3.1, all local $ref resolve, security schemes consistent with corrected auth strategy, error responses RFC7807-compatible with message_key, P0 endpoint groups align with API_CONTRACT, PRD story IDs, authorization rules, no future payment/AI/wearable as P0.

  version: 1.0.1-provisional-corrected
  contact:
    name: CoachOS Platform Team
    url: https://github.com/AliNaderiii/CoachOS-Fitness-Coaching-Platform
  license:
    name: MIT (Review Pending Founder Decision — ADR-012)

servers:
  - url: https://api.coachos.example.com/api/v1
    description: Production (proposed — replace with real domain)
  - url: https://staging-api.coachos.example.com/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - cookieAuth: []  # Recommended MVP — HttpOnly Secure SameSite=Lax, CSRF double-submit, no localStorage long-lived tokens
  - bearerAuth: []  # Optional alternative — short-lived ≤15min in memory + rotating refresh in HttpOnly cookie, explicit prohibition localStorage

x-auth-strategy:
  recommended: cookieAuth
  optional: bearerAuth
  notes: |
    Recommended MVP cookie sessions per ADR-032 corrected: HttpOnly true, Secure true, SameSite Lax, CSRF token header X-CSRFToken, no long-lived tokens in localStorage. Optional JWT alternative short-lived access in memory + rotating refresh HttpOnly cookie reuse detection. Frontend/backend trust boundary browser untrusted backend authoritative. FE --> SecretMgr forbidden — private secrets only backend/worker via server-side injection.

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: User Registration & Email Credential Onboarding
      description: Public endpoint. Creates User record with Argon2id/bcrypt hash, issues session/token. Rate-limited per IP.
      operationId: register
      security: []
      x-purpose: Onboard unauthenticated user via email+password
      x-required-role: Public
      x-object-permission: None — new user
      x-audit-event: user.registered
      x-rate-limit: 5/min per IP
      x-data-sensitivity: Tier1 Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              coach:
                value:
                  email: coach.reza@example.com
                  password: SecurePassword123!
                  display_name: Reza Rahimi
                  preferred_locale: fa-IR
                  invitation_token: optional_token
      responses:
        '201':
          description: Created + authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Secure Password Authentication
      description: Verifies credentials, resets failed counters on success, establishes session. Rate-limited.
      operationId: login
      security: []
      x-required-role: Public
      x-audit-event: auth.login, auth.login_failed, auth.login_rate_limit_exceeded
      x-rate-limit: 5 fails per 15min per IP/email
      x-data-sensitivity: Tier1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user profile
      description: Returns authenticated user profile + memberships. Locale via Accept-Language.
      operationId: getCurrentUser
      x-required-role: Authenticated
      x-object-permission: Self only
      x-audit-event: none
      x-localization: Returns display_name etc; Accept-Language fa-IR/en-US; formats numbers via intl client-side
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Authentication]
      summary: Update current user profile
      description: Update display_name, preferred_locale, preferred_unit, timezone. Requires auth.
      operationId: updateCurrentUser
      x-required-role: Authenticated self
      x-audit-event: user.profile_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset link
      description: Generates cryptographically random single-use token 15min TTL, sends localized email.
      operationId: forgotPassword
      security: []
      x-rate-limit: 5/15min per IP/email
      x-audit-event: auth.password_reset_requested
      x-data-sensitivity: Tier1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted (always returns 202 to avoid email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_key:
                    type: string
                    example: auth.reset_email_sent_if_exists
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password/{token}:
    post:
      tags: [Authentication]
      summary: Confirm password reset with single-use token
      description: Invalidates all active sessions after success, token single-use enforcement 400 on reuse.
      operationId: resetPasswordConfirm
      security: []
      x-audit-event: auth.password_reset_completed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_key:
                    type: string
                    example: auth.password_reset_success
        '400':
          description: Token invalid/used/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /organizations:
    post:
      tags: [Organizations]
      summary: Create organization workspace
      description: Creates org + primary location + owner membership. Slug unique check 409.
      operationId: createOrganization
      x-required-role: Authenticated user
      x-object-permission: Any authenticated user can create tenant
      x-audit-event: org.created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Org created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Organizations]
      summary: List organizations I belong to
      description: Returns organizations for authenticated user via memberships.
      operationId: listMyOrganizations
      x-required-role: Authenticated
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationResponse'

  /organizations/{org_id}:
    get:
      tags: [Organizations]
      summary: Get organization settings
      description: Owner full, Coach limited, Athlete branding only, Support read.
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Membership active in org
      x-object-permission: org_id filter from server context
      responses:
        '200':
          description: Org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      summary: Update organization settings
      description: Owner only.
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      x-audit-event: org.settings_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{org_id}/locations:
    get:
      tags: [Locations]
      summary: Get primary location
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Org member read-only
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
    patch:
      tags: [Locations]
      summary: Update primary location (single-location MVP)
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      x-audit-event: org.location_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Updated location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

  /organizations/{org_id}/invitations:
    post:
      tags: [Memberships]
      summary: Dispatch organization invitation
      description: Owner can invite Coach/Athlete/Support, Coach can invite Athlete only. Generates secure 7-day single-use token hash.
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner or Coach (Coach athlete only)
      x-object-permission: Owner any role, Coach athlete only — else 403
      x-audit-event: invitation.sent
      x-rate-limit: 10/min per org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Memberships]
      summary: List pending invitations
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvitationResponse'

  /organizations/{org_id}/members:
    get:
      tags: [Memberships]
      summary: List members & assignments
      description: Filter by role/status/assigned coach.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, coach, athlete, support]
        - name: status
          in: query
          schema:
            type: string
            enum: [invited, active, suspended]
      x-required-role: Owner, Coach (own athletes?) — Owner full, Coach limited to own assigned athletes list
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'

  /organizations/{org_id}/members/{membership_id}:
    patch:
      tags: [Memberships]
      summary: Suspend/unsuspend member
      description: Owner only. Immediate revocation 403 for suspended membership. Logs audit.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-required-role: Owner
      x-audit-event: membership.status_changed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitations/{token}/validate:
    get:
      tags: [Invitations]
      summary: Validate invitation token (public)
      description: Checks hash, expiry 7d, not used. For setup UI.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid invite details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationValidateResponse'
        '410':
          description: Expired or used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /exercises:
    get:
      tags: [Exercise Catalog]
      summary: Search & filter exercises with Persian character-variant folding
      description: Supports query `q` with Perso-Arabic script keyboard-variant normalization for Persian search, filtering by muscle, movement pattern, equipment, locale fa-IR/en-US. Returns canonical global + org-private.
      operationId: listExercises
      parameters:
        - name: q
          in: query
          description: Search string supports Persian Unicode variant folding
          schema:
            type: string
        - name: muscle
          in: query
          schema:
            type: string
        - name: movement_pattern
          in: query
          schema:
            type: string
            enum: [squat, hinge, horizontal_push, horizontal_pull, vertical_push, vertical_pull, lunge, carry, isolation, cardio, other]
        - name: equipment
          in: query
          schema:
            type: string
        - name: locale
          in: query
          description: Active translation filter fa-IR/en-US only
          schema:
            type: string
            enum: [fa-IR, en-US]
      x-required-role: Authenticated user in org
      x-object-permission: org_id filter (canonical NULL + org private) + assignment not required for global catalog
      x-localization: Notes fa-IR/en-US bilingual names, Accept-Language header optional
      responses:
        '200':
          description: Results sorted by normalized relevance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Exercise Catalog]
      summary: Create private custom exercise with media rights metadata
      description: Owner/Coach org-private only. Media upload separate but rights metadata required.
      operationId: createPrivateExercise
      x-required-role: Owner or Coach in org
      x-audit-event: exercise.created_private
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /exercises/{exercise_id}:
    get:
      tags: [Exercise Catalog]
      summary: Exercise detail + demo media (signed URLs)
      parameters:
        - name: exercise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-required-role: Authenticated org member (canonical global + org private)
      x-object-permission: Org scope for private custom
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/exercises/moderation:
    get:
      tags: [Exercise Moderation]
      summary: List pending exercise submissions (platform admin only, MFA)
      x-required-role: Platform Admin MFA
      x-audit-event: admin.moderation_queue_viewed (optional)
      responses:
        '200':
          description: Queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationQueueResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Exercise Moderation]
      summary: Moderate (approve/reject) exercise
      x-required-role: Platform Admin MFA
      x-audit-event: exercise.published / exercise.rejected
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message_key:
                    type: string

  /programs:
    get:
      tags: [Programs]
      summary: List org programs & templates
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: is_template
          in: query
          schema:
            type: boolean
      x-required-role: Owner, Coach in org
      responses:
        '200':
          description: Programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
    post:
      tags: [Programs]
      summary: Create master program (hierarchical)
      description: Creates Program + phases/weeks/days/workouts/items/prescriptions atomic.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner, Coach
      x-audit-event: program.created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'

  /programs/{program_id}:
    get:
      tags: [Programs]
      summary: Get program detail (builder)
      parameters:
        - name: program_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-required-role: Owner, Coach in org (program org scope)
      responses:
        '200':
          description: Program detail with hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
    patch:
      tags: [Programs]
      summary: Update program
      x-audit-event: program.updated
      parameters:
        - name: program_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgramRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'

  /programs/{program_id}/clone:
    post:
      tags: [Templates]
      summary: Clone program as independent copy (template)
      description: Template clone does NOT mutate master.
      parameters:
        - name: program_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-audit-event: template.cloned
      responses:
        '201':
          description: Clone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'

  /program-assignments:
    post:
      tags: [Assignments]
      summary: Assign program to athlete with immutable snapshot
      description: Verifies CoachAthleteAssignment, creates snapshot JSONB immutable, schedules workouts, notifies athlete.
      operationId: assignProgram
      x-required-role: Owner any org athlete, Coach assigned athletes only
      x-audit-event: program.assigned
      x-idempotency: Optional Idempotency-Key header recommended
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment + snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Assignments]
      summary: List assignments (filter athlete)
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: athlete_id
          in: query
          schema:
            type: string
            format: uuid
      x-required-role: Owner, Coach (assigned athletes only), Athlete self
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'

  /athlete/today:
    get:
      tags: [Athlete Today]
      summary: Athlete Today's Workout dashboard
      description: Returns scheduled workouts for today for authenticated athlete, based on active assignment snapshot. Cached shell + network status.
      operationId: getTodayWorkout
      x-required-role: Athlete self
      x-audit-event: none
      responses:
        '200':
          description: Today's workouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'

  /workout-sessions:
    post:
      tags: [Workout Sessions]
      summary: Start workout session (scheduled → in_progress)
      operationId: startWorkoutSession
      x-required-role: Athlete self
      x-audit-event: session.started
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionResponse'

  /workout-sessions/{session_id}:
    get:
      tags: [Workout Sessions]
      summary: Get workout session detail
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-required-role: Athlete self OR Assigned Coach OR Owner org operational
      x-object-permission: Assignment check + org scope
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Workout Sessions]
      summary: Complete workout session (in_progress → completed)
      description: Optional pain flag embedded.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
