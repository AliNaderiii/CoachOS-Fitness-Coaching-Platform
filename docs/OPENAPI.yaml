        body: { type: string, maxLength: 2000 }
        created_at: { type: string, format: date-time }

    MessageListResponse:
      type: object
      properties:
        messages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MessageResponse'
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    ReadReceiptResponse:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        last_read_at: { type: string, format: date-time }
        unread_count: { type: integer, minimum: 0, maximum: 99 }

    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        event_type:
          type: string
          enum: [message.sent, workout.completed, feedback_flag.created]
        category:
          type: string
          enum: [messaging, training, safety, account]
        title_key:
          type: string
          description: i18n key resolved client-side; the server never returns locale-rendered copy.
        body_key: { type: string }
        payload:
          type: object
          description: |
            Metadata only — identifiers, actor display name, and a deep-link route.
            Never message bodies, email addresses, tokens, or provider references.
          example:
            conversation_id: 019a0b7c-4d21-7000-8000-2b91f0c7a410
            actor_display_name: Coach Reza
            route: /messages/019a0b7c-4d21-7000-8000-2b91f0c7a410
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/NotificationResponse'
        unread_count: { type: integer, minimum: 0, maximum: 99 }
        next_cursor: { type: string, nullable: true }

    NotificationPreferenceRow:
      type: object
      properties:
        event_type: { type: string }
        category: { type: string, enum: [messaging, training, safety, account] }
        channel: { type: string, enum: [in_app, email, web_push] }
        is_enabled: { type: boolean }
        is_locked:
          type: boolean
          description: True for safety-category in-app notifications, which cannot be disabled.

    NotificationPreferenceResponse:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreferenceRow'
        quiet_hours_enabled: { type: boolean }
        quiet_hours_start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        quiet_hours_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        web_push_permission_state:
          type: string
          enum: [unknown, granted, denied]
        timezone:
          type: string
          description: IANA timezone from the user profile; quiet hours are evaluated in it.
        channels_available:
          type: object
          description: |
            Honest capability report. Phase 08 ships no email or Web Push provider,
            so both are false and their adapters are deterministic local fakes.
          properties:
            in_app: { type: boolean }
            email: { type: boolean }
            web_push: { type: boolean }

    UpdateNotificationPreferenceRequest:
      type: object
      properties:
        preferences:
          type: array
          maxItems: 32
          items:
            type: object
            required: [event_type, channel, is_enabled]
            properties:
              event_type:
                type: string
                enum: [message.sent, workout.completed, feedback_flag.created]
              channel: { type: string, enum: [in_app, email, web_push] }
              is_enabled: { type: boolean }
        quiet_hours_enabled: { type: boolean }
        quiet_hours_start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        quiet_hours_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        web_push_permission_state:
          type: string
          enum: [unknown, granted, denied]

    AuditResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        organization_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        target_entity_type:
          type: string
        target_entity_id:
          type: string
        ip_hash:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    AuditListResponse:
      type: object
      properties:
        audit_events:
          type: array
          items:
            $ref: '#/components/schemas/AuditResponse'

    ExportRequestResponse:
      type: object
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        expires_at:
          type: string
          format: date-time
          nullable: true

    ErasureRequestResponse:
      type: object
      properties:
        erasure_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
    CopilotCapabilitiesResponse:
      type: object
      properties:
        feature:
          type: object
          properties:
            enabled:
              type: boolean
            disabled_reason:
              type: string
        policy_version:
          type: string
        provider:
          type: object
          properties:
            provider_slug:
              type: string
            provider_enabled:
              type: boolean
            model_identifier:
              type: string
        capabilities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [summarize_progress, draft_check_in, suggest_program_adjustment]
              output_schema:
                type: string
              requires_human_review:
                type: boolean
              enabled:
                type: boolean
              disabled_reason:
                type: string
              label:
                type: object
        limits:
          type: object
        prohibited_notice_key:
          type: string

    CopilotRunCreateRequest:
      type: object
      required: [capability, athlete_id, generation_language]
      properties:
        org_id:
          type: string
        capability:
          type: string
          enum: [summarize_progress, draft_check_in, suggest_program_adjustment]
        athlete_id:
          type: string
        generation_language:
          type: string
          enum: [fa-IR, en-US]
          description: Explicit. Arabic is not a supported generation language.
        parameters:
          type: object
          properties:
            period_days:
              type: integer
              minimum: 1
              maximum: 30
            notes:
              type: string
              maxLength: 500
              description: Screened server-side for prohibited intent; treated as untrusted data.
            variation:
              type: integer
              minimum: 0
        idempotency_key:
          type: string
          maxLength: 64

    CopilotRun:
      type: object
      properties:
        id:
          type: string
        capability:
          type: string
        generation_language:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, expired]
        athlete_id:
          type: string
        policy_version:
          type: string
        provider_slug:
          type: string
        model_identifier:
          type: string
        prompt_template_id:
          type: string
          nullable: true
        attempt_count:
          type: integer
        duration_ms:
          type: integer
        input_tokens_est:
          type: integer
        output_tokens_est:
          type: integer
        cost_micro_usd:
          type: integer
        error_code:
          type: string
        fallback_applied:
          type: boolean
        input_context_hash:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        regenerated_from_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
          description: Redacted, truncated, coach-inspectable input context actually used.
          properties:
            payload:
              type: object
            limitations:
              type: array
              items:
                type: string
            omissions:
              type: array
              items:
                type: string
                description: Data categories deliberately NOT included (e.g. progress_photos, body_metrics).
        output:
          $ref: '#/components/schemas/CopilotOutput'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSourceReference'
        actions:
          type: object
        ai_generated:
          type: boolean
        requires_human_review:
          type: boolean
        replayed:
          type: boolean

    CopilotOutput:
      type: object
      nullable: true
      properties:
        id:
          type: string
        schema_name:
          type: string
          enum: [ai_progress_summary.v1, ai_check_in_message.v1, ai_program_adjustment.v1]
        schema_version:
          type: integer
        validation_status:
          type: string
          enum: [valid, invalid]
        status:
          type: string
          enum: [draft, edited, approved, rejected, quarantined, expired]
        payload:
          type: object
          nullable: true
          description: Schema-validated structured draft. Null for quarantined/expired outputs.
        was_edited:
          type: boolean
        reviewed_by_id:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_note:
          type: string

    CopilotSourceReference:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        source_type:
          type: string
          enum: [workout_session, set_log, feedback_flag, program_assignment, exercise]
        source_id:
          type: string
        descriptor:
          type: string
        ordinal:
          type: integer
        record_url:
          type: string

    CopilotRunListResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/CopilotRun'
        count:
          type: integer
        retention_days:
          type: integer

    CopilotEditOutputRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: Full edited draft payload; revalidated against the capability schema.

    CopilotReviewNoteRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    CopilotReportRequest:
      type: object
      required: [report_type]
      properties:
        report_type:
          type: string
          enum: [unsafe, incorrect, privacy, hallucinated_source, other]
        detail:
          type: string
          maxLength: 1000

    CopilotReportResponse:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        report_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
