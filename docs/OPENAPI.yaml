components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Optional alternative — JWT access token short-lived ≤15min in memory (not localStorage) + rotating refresh token in HttpOnly Secure SameSite cookie with reuse detection revoking all sessions on reuse.
        Explicit prohibition: never store long-lived refresh/access tokens in localStorage/sessionStorage.
        When using bearer, Authorization header Bearer not auto-sent cross-origin, intrinsically CSRF-resistant, but still need XSS protections and HttpOnly refresh.
        Marked proposed/conditional requiring Phase04 validation. Recommended MVP is cookieAuth.
        Frontend MUST NEVER access Secrets Manager — private secrets only backend/worker via server-side injection.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Recommended MVP — HttpOnly; Secure; SameSite=Lax session cookie per ADR-032 corrected.
        HttpOnly true (JS inaccessible prevents XSS theft), Secure true (HTTPS only), SameSite=Lax (CSRF mitigation, balances usability).
        No long-lived tokens in localStorage/sessionStorage — explicit prohibition.
        CSRF strategy: double-submit token or Django CSRF middleware — frontend reads csrftoken cookie (readable) and sends X-CSRFToken header for state-changing mutations.
        Frontend/backend trust boundary: browser untrusted, backend authoritative.
        Frontend MUST NEVER access Secrets Manager directly — only public NEXT_PUBLIC_* runtime config.

  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization tenant ID in organization-scoped path routes.
    OrgIdQuery:
      name: org_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant context candidate; authorization always requires an active server-side membership and never trusts this value alone.
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Conversation ID. Non-participants receive 404 regardless of tenant.
    ExerciseId:
      name: exercise_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: program_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid authentication — RFC 7807 response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller lacks role or object-level assignment — 403 or 404 for cross-tenant obscurity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found or belongs to other tenant — 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Unique constraint violation (slug, email) — 409
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit breached — 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [type, title, status, detail, instance, message_key, correlation_id]
      properties:
        type:
          type: string
          format: uri
          description: RFC7807 type URI
          example: https://api.coachos.example.com/errors/permission_denied
        title:
          type: string
          example: Permission Denied
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: You do not possess an active assignment for this athlete.
        instance:
          type: string
          format: uri
          example: /api/v1/athletes/019f.../progress/photos
        message_key:
          type: string
          description: Localized message key extension for frontend i18n
          example: errors.authz.unassigned_athlete
        correlation_id:
          type: string
          description: Request correlation identifier; may be '-' when unavailable.
          example: 01912345-1234-7123-8123-123456789abc
        field_errors:
          type: object
          additionalProperties: true
          description: DRF field-level validation details; values may be arrays or nested objects.

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          example: coach.reza@example.com
        password:
          type: string
          minLength: 8
          example: SecurePassword123!
        display_name:
          type: string
          minLength: 2
          example: Reza Rahimi
        preferred_locale:
          type: string
          enum: [fa-IR, en-US]
        invitation_token:
          type: string
          description: Optional invitation token from email link

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UpdateMeRequest:
      type: object
      properties:
        display_name:
          type: string
        preferred_locale:
          type: string
          enum: [fa-IR, en-US]
        preferred_unit:
          type: string
          enum: [kg, lbs]
        timezone:
          type: string

    AuthResponse:
      description: |
        **Corrected for Auth Transport Consistency — Final Fix Task 2:**
        - **Recommended MVP (cookieAuth):** Response does NOT include access_token/refresh_token in JSON body. Authentication via HttpOnly Secure SameSite=Lax session cookie set via Set-Cookie header (sessionid), plus CSRF token via separate csrftoken cookie (readable) for state-changing mutations. Frontend must NOT store long-lived tokens in localStorage/sessionStorage. No tokens in body for MVP — cookie set via header.
        - **Optional Alternative (bearerAuth):** When optional bearer/JWT strategy selected, response MAY include short-lived access_token (≤15min, to be held in memory not localStorage) and rotating refresh_token in HttpOnly Secure SameSite cookie (or as HttpOnly cookie, not in body for refresh). For backward compatibility, tokens documented as optional/nullable and explicitly marked present only when optional bearer strategy is selected.
        - **Explicit Prohibition:** No long-lived token may be stored in localStorage or sessionStorage. Frontend MUST NEVER access Secrets Manager.
        - **Provisional:** Remains provisional until Phase04 implementation validation — final choice recommended cookieAuth.
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'
        csrf_token:
          type: string
          nullable: true
          description: |
            CSRF token for cookie-session mutations — present only when cookieAuth recommended MVP is used.
            Frontend reads csrftoken cookie (non-HttpOnly) and sends X-CSRFToken header for POST/PATCH/DELETE.
            Marked optional and provisional.
        access_token:
          type: string
          nullable: true
          description: |
            **Optional — Bearer/JWT alternative only.** Short-lived access token ≤15min in memory (not localStorage).
            **Must NOT be present in recommended cookie-session MVP** — MVP uses HttpOnly session cookie via Set-Cookie header, not tokens in body.
            Present only when optional bearer strategy selected — marked optional/nullable, explicitly documented.
            Explicit prohibition: never store in localStorage/sessionStorage.
        refresh_token:
          type: string
          nullable: true
          description: |
            **Optional — Bearer/JWT alternative only.** Rotating refresh token — should be delivered as HttpOnly Secure SameSite cookie, not in JSON body for production.
            If included in body for transitional compatibility, it is optional/nullable and present only when optional bearer strategy selected.
            Recommended: refresh token as HttpOnly cookie with reuse detection revoking all sessions on reuse.
            Explicit prohibition: never store long-lived refresh in localStorage/sessionStorage.
        message:
          type: string
          description: Localized message_key extension may be added via x- pattern.

    CookieAuthResponse:
      description: |
        **Recommended MVP Response — Cookie Session:**
        - No access_token/refresh_token in body — authentication via HttpOnly Secure SameSite=Lax session cookie (sessionid) set via Set-Cookie header.
        - CSRF token via csrftoken cookie (readable) + X-CSRFToken header for state-changing mutations.
        - No long-lived tokens in localStorage/sessionStorage.
        - Public runtime config from PublicConfigProvider --> FE, private secrets BE --> SecretMgr, Worker --> SecretMgr, FE --> BE HTTPS /api/v1 requests only.
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          properties:
            csrf_token:
              type: string
              description: CSRF token for state-changing mutations when using cookieAuth.

    BearerAuthResponse:
      description: |
        **Optional Alternative Response — Bearer/JWT (Proposed/Conditional):**
        - Short-lived access_token ≤15min in memory (not localStorage) + rotating refresh_token in HttpOnly Secure SameSite cookie with reuse detection.
        - Explicit prohibition: never store long-lived tokens in localStorage/sessionStorage.
        - Marked proposed/conditional requiring Phase04 validation — not recommended MVP.
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          properties:
            access_token:
              type: string
              description: Short-lived access ≤15min in memory only when bearerAuth selected.
            refresh_token:
              type: string
              description: Rotating refresh HttpOnly Secure SameSite cookie — preferably not in body but as HttpOnly cookie; if in body, transitional only, optional.

    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        preferred_locale:
          type: string
          enum: [fa-IR, en-US]
        preferred_unit:
          type: string
        timezone:
          type: string
        is_platform_admin:
          type: boolean

    OrganizationResponse:
