openapi: 3.1.0
info:
  title: CoachOS API
  description: |
    OpenAPI 3.1 contract for CoachOS B2B2C fitness coaching platform.
    Operations marked `x-implementation-status: implemented-phase-06`, `implemented-phase-07`, `implemented-phase-10`, or `implemented-phase-11` are reconciled to the corresponding Django/DRF routes and serializers. Other historical paths remain provisional future contracts and MUST NOT be interpreted as implemented merely because they appear in this document.
    Phase 10 implements organization-level provider-neutral billing metadata, deterministic fake-provider hosted sessions, verified/idempotent webhook ingestion, server-side entitlements, bounded invoice summaries, billing-admin delegation, and reconciliation visibility. Athletes remain free/included. It does not claim live-provider, PCI, tax, accounting, or legal-invoice readiness.
    Phase 11 implements governed, draft-only AI Copilot routes with human approval, provider neutrality, no message sending, and no automatic program mutation.

    **Authentication Transport Consistency — Corrected (ADR-032):**
    - **Recommended MVP Strategy:** HttpOnly/Secure/SameSite cookie sessions (Django sessionid):
      - HttpOnly true (JS inaccessible, prevents XSS theft), Secure true (HTTPS only), SameSite=Lax (CSRF mitigation, Lax balances usability vs Strict).
      - No long-lived tokens in localStorage/sessionStorage — explicit prohibition.
      - CSRF strategy for cookie-based mutations: double-submit token or Django CSRF middleware — frontend reads csrftoken cookie (non-HttpOnly readable) and sends X-CSRFToken header for POST/PATCH/DELETE, backend verifies, SameSite=Lax additional layer.
      - Frontend/backend trust boundary: browser untrusted, backend authoritative, all auth checks server-side.
    - **Optional Alternative (Bearer/JWT):** If bearer/JWT retained:
      - Short-lived access ≤15min in memory (not localStorage), rotating refresh in HttpOnly Secure SameSite cookie with reuse detection revoking all sessions on reuse.
      - Explicit prohibition: never store long-lived refresh/access tokens in localStorage/sessionStorage.
      - When using bearer, Authorization header Bearer not auto-sent cross-origin, intrinsically CSRF-resistant, but still need XSS protections and HttpOnly refresh.
    - **Final Choice for First Implementation:** Cookie sessions (simpler, Django built-in). JWT alternative remains optional, marked proposed/conditional requiring Phase 04 validation. Both schemes documented but recommendation clear.

    **Secrets Boundary Correction:**
    - Frontend MUST NEVER access Secrets Manager directly — private secrets (DB URLs, Django SECRET_KEY, Redis/S3 credentials, email API keys, JWT signing keys) only to backend/worker via server-side injection. Frontend only public NEXT_PUBLIC_* runtime config. FE --> SecretMgr forbidden and removed from diagrams.

    **CSP Correction:**
    - Production preferred nonce/hash-based script-src (script-src 'self' 'nonce-{random}' 'strict-dynamic' https:), no unsafe-inline as accepted production control. Temporary unsafe-inline exception during Phase04 if framework requires, marked temporary with risk and hardening task TODO-CSP-001, not finalized before validation.

    Languages: Persian fa-IR RTL + English en-US LTR only. Arabic is out of scope. Phase 10 billing endpoints are organization-only; Phase 11 AI endpoints are governed professional drafting tools; wearable endpoints remain unimplemented.
    Error model: RFC7807 compatible + message_key extension for localized frontend messages.

    **OpenAPI Validity:** YAML parses successfully, OpenAPI 3.1, all local $ref resolve, security schemes align with the cookie-auth strategy, and Phase 10 billing routes remain organization-scoped with a signed public webhook exception.

  version: 1.12.0-parallel-wave
  contact:
    name: CoachOS Platform Team
    url: https://github.com/AliNaderiii/CoachOS-Fitness-Coaching-Platform
  license:
    name: Proprietary / All Rights Reserved (ADR-012)

servers:
  - url: https://api.coachos.example.com/api/v1
    description: Production (proposed — replace with real domain)
  - url: https://staging-api.coachos.example.com/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - cookieAuth: []  # Recommended MVP — HttpOnly Secure SameSite=Lax, CSRF double-submit, no localStorage long-lived tokens
  - bearerAuth: []  # Optional alternative — short-lived ≤15min in memory + rotating refresh in HttpOnly cookie, explicit prohibition localStorage

x-auth-strategy:
  recommended: cookieAuth
  optional: bearerAuth
  notes: |
    Recommended MVP cookie sessions per ADR-032 corrected: HttpOnly true, Secure true, SameSite Lax, CSRF token header X-CSRFToken, no long-lived tokens in localStorage. Optional JWT alternative short-lived access in memory + rotating refresh HttpOnly cookie reuse detection. Frontend/backend trust boundary browser untrusted backend authoritative. FE --> SecretMgr forbidden — private secrets only backend/worker via server-side injection.

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: User Registration & Email Credential Onboarding
      description: |
        Public endpoint. Creates User record with Argon2id/bcrypt hash.
        **Recommended MVP (cookieAuth):** Issues session via HttpOnly Secure SameSite=Lax session cookie (sessionid) set via Set-Cookie header + CSRF token via csrftoken cookie for state-changing mutations. No access_token/refresh_token in body for MVP — tokens optional/nullable only when optional bearer strategy selected.
        **Optional Alternative (bearerAuth):** Short-lived access ≤15min in memory + rotating refresh HttpOnly cookie with reuse detection.
        Rate-limited per IP. No long-lived tokens in localStorage. Frontend never accesses Secrets Manager — public config only via PublicConfigProvider --> FE, private secrets BE/Worker --> SecretMgr.
        Provisional until Phase04 validation.
      operationId: register
      security: []
      x-purpose: Onboard unauthenticated user via email+password
      x-required-role: Public
      x-object-permission: None — new user
      x-audit-event: user.registered
      x-rate-limit: 5/min per IP
      x-data-sensitivity: Tier1 Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              coach:
                value:
                  email: coach.reza@example.com
                  password: SecurePassword123!
                  display_name: Reza Rahimi
                  preferred_locale: fa-IR
                  invitation_token: optional_token
      responses:
        '201':
          description: Created + authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Secure Password Authentication
      description: |
        Verifies credentials, resets failed counters on success, establishes session. Rate-limited.
        **Recommended MVP (cookieAuth):** Establishes HttpOnly Secure SameSite=Lax session cookie via Set-Cookie header + CSRF token, no tokens in body. No long-lived tokens in localStorage.
        **Optional Alternative (bearerAuth):** Returns short-lived access ≤15min in memory (optional/nullable) + rotating refresh HttpOnly cookie with reuse detection — only when bearer strategy selected.
        Frontend never accesses Secrets Manager — public config only via PublicConfigProvider --> FE, private secrets BE/Worker --> SecretMgr. FE --> BE HTTPS /api/v1 requests only.
        Provisional until Phase04 validation.
      operationId: login
      security: []
      x-required-role: Public
      x-audit-event: auth.login, auth.login_failed, auth.login_rate_limit_exceeded
      x-rate-limit: 5 fails per 15min per IP/email
      x-data-sensitivity: Tier1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user profile
      description: Returns authenticated user profile + memberships. Locale via Accept-Language.
      operationId: getCurrentUser
      x-required-role: Authenticated
      x-object-permission: Self only
      x-audit-event: none
      x-localization: Returns display_name etc; Accept-Language fa-IR/en-US; formats numbers via intl client-side
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Authentication]
      summary: Update current user profile
      description: Update display_name, preferred_locale, preferred_unit, timezone. Requires auth.
      operationId: updateCurrentUser
      x-required-role: Authenticated self
      x-audit-event: user.profile_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset link
      description: Generates cryptographically random single-use token 15min TTL, sends localized email.
      operationId: forgotPassword
      security: []
      x-rate-limit: 5/15min per IP/email
      x-audit-event: auth.password_reset_requested
      x-data-sensitivity: Tier1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted (always returns 202 to avoid email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_key:
                    type: string
                    example: auth.reset_email_sent_if_exists
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password/{token}:
    post:
      tags: [Authentication]
      summary: Confirm password reset with single-use token
      description: Invalidates all active sessions after success, token single-use enforcement 400 on reuse.
      operationId: resetPasswordConfirm
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      x-audit-event: auth.password_reset_completed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_key:
                    type: string
                    example: auth.password_reset_success
        '400':
          description: Token invalid/used/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /organizations:
    post:
      tags: [Organizations]
      summary: Create organization workspace
      description: Creates org + primary location + owner membership. Slug unique check 409.
      operationId: createOrganization
      x-required-role: Authenticated user
      x-object-permission: Any authenticated user can create tenant
      x-audit-event: org.created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Org created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Organizations]
      summary: List organizations I belong to
      description: Returns organizations for authenticated user via memberships.
      operationId: listMyOrganizations
      x-required-role: Authenticated
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationResponse'

  /organizations/{org_id}:
    get:
      tags: [Organizations]
      summary: Get organization settings
      description: Owner full, Coach limited, Athlete branding only, Support read.
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Membership active in org
      x-object-permission: org_id filter from server context
      responses:
        '200':
          description: Org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      summary: Update organization settings
      description: Owner only.
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      x-audit-event: org.settings_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{org_id}/locations:
    get:
      tags: [Locations]
      summary: Get primary location
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Org member read-only
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
    patch:
      tags: [Locations]
      summary: Update primary location (single-location MVP)
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      x-audit-event: org.location_updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Updated location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

  /organizations/{org_id}/invitations:
    post:
      tags: [Memberships]
      summary: Dispatch organization invitation
      description: Owner can invite Coach/Athlete/Support, Coach can invite Athlete only. Generates secure 7-day single-use token hash.
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner or Coach (Coach athlete only)
      x-object-permission: Owner any role, Coach athlete only — else 403
      x-audit-event: invitation.sent
      x-rate-limit: 10/min per org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Memberships]
      summary: List pending invitations
      parameters:
        - $ref: '#/components/parameters/OrgId'
      x-required-role: Owner
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvitationResponse'

  /organizations/{org_id}/members:
    get:
      tags: [Memberships]
      summary: List members & assignments
      description: Filter by role/status/assigned coach.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, coach, athlete, support]
        - name: status
          in: query
          schema:
            type: string
            enum: [invited, active, suspended]
      x-required-role: Owner, Coach (own athletes?) — Owner full, Coach limited to own assigned athletes list
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'

  /organizations/{org_id}/members/{membership_id}:
    patch:
      tags: [Memberships]
      summary: Suspend/unsuspend member
      description: Owner only. Immediate revocation 403 for suspended membership. Logs audit.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-required-role: Owner
      x-audit-event: membership.status_changed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitations/{token}/validate:
    get:
      tags: [Invitations]
      summary: Validate invitation token (public)
      description: Checks hash, expiry 7d, not used. For setup UI.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid invite details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationValidateResponse'
        '410':
          description: Expired or used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /exercises:
    get:
      tags: [Exercise Catalog]
      summary: Search and filter the visible exercise catalog
      description: Returns published canonical exercises plus published private exercises belonging to the requested active organization. Persian query and stored names/aliases use keyboard-variant normalization.
      operationId: listExercises
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Any active organization member
      x-object-permission: Active membership in org_id; canonical organization-null plus only that organization's private exercises
      parameters:
        - $ref: '#/components/parameters/OrgIdQuery'
        - name: q
          in: query
          schema: { type: string }
          description: Name or alias query; Persian keyboard variants are normalized server-side.
        - name: muscle
          in: query
          schema: { type: string }
        - name: movement_pattern
          in: query
          schema:
            $ref: '#/components/schemas/MovementPattern'
        - name: equipment
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/ExerciseDifficulty'
        - name: locale
          in: query
          schema:
            $ref: '#/components/schemas/SupportedLocale'
      responses:
        '200':
          description: Visible published exercises, capped at 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Exercise Catalog]
      summary: Create an organization-private exercise
      description: Requires an active owner or coach membership. The org_id is validated server-side. Attached media requires complete commercial-use rights metadata and private storage keys. Django cookie-session CSRF validation applies.
      operationId: createPrivateExercise
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active owner or coach in org_id
      x-audit-event: exercise.created_private
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
            examples:
              privateExercise:
                value:
                  org_id: 01912345-1234-7123-8123-123456789abc
                  movement_pattern: horizontal_push
                  difficulty: intermediate
                  primary_muscles: [chest]
                  secondary_muscles: [triceps]
                  equipment_required: [dumbbell]
                  translations:
                    - locale: fa-IR
                      name: پرس سینه دمبل
                      instructions: وزنه را با کنترل حرکت دهید.
                      coaching_cues: [کنترل حرکت]
                      common_mistakes: [قوس بیش از حد]
                    - locale: en-US
                      name: Dumbbell Chest Press
                      instructions: Move the weight with control.
                      coaching_cues: [Stay controlled]
                      common_mistakes: [Excessive arch]
                  aliases:
                    - locale: fa-IR
                      alias: پرس سينه
                  media_assets:
                    - media_type: video_mp4
                      storage_key: org/01912345/exercises/demo.mp4
                      duration_seconds: 30
                      bytes_size: 1024
                      checksum_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      rights:
                        license_type: coach_upload
                        source_url: https://example.com/provenance/demo
                        creator_attribution: Example Coach
                        permitted_commercial_use: true
      responses:
        '201':
          description: Private published exercise created; storage keys are never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exercises/{exercise_id}:
    get:
      tags: [Exercise Catalog]
      summary: Get a visible published exercise
      operationId: getExercise
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Any active organization member
      x-object-permission: Canonical exercise or private exercise owned by org_id
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
        - $ref: '#/components/parameters/OrgIdQuery'
      responses:
        '200':
          description: Exercise detail and rights metadata; no raw storage URL/key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exercises/moderation:
    get:
      tags: [Exercise Moderation]
      summary: List pending exercise submissions
      operationId: listExerciseModerationQueue
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active platform administrator
      responses:
        '200':
          description: Pending exercise queue, capped at 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationQueueResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Exercise Moderation]
      summary: Approve or reject a pending exercise
      description: Approval requires both supported translations, at least one media asset, commercial-use permission, and platform-admin review metadata. Cookie-session CSRF validation applies.
      operationId: moderateExercise
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active platform administrator
      x-audit-event: exercise.published or exercise.rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationDecisionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /programs:
    get:
      tags: [Programs]
      summary: List organization programs and templates
      operationId: listPrograms
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active owner or coach
      parameters:
        - $ref: '#/components/parameters/OrgIdQuery'
        - name: is_template
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Non-archived program summaries, capped at 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Programs]
      summary: Atomically create a hierarchical program
      description: Creates phases, weeks, days, workouts, items, and set prescriptions. Every exercise must be canonical or private to org_id. Cookie-session CSRF validation applies.
      operationId: createProgram
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active owner or coach in org_id
      x-audit-event: program.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '201':
          description: Program hierarchy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /programs/{program_id}:
    get:
      tags: [Programs]
      summary: Get an organization program hierarchy
      operationId: getProgram
      security:
        - cookieAuth: []
      x-implementation-status: implemented-phase-06
      x-required-role: Active owner or coach in the program organization
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Ordered program hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '404': { $ref: '#/components/responses/NotFound' }
