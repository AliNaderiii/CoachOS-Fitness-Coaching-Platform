    AuditListResponse:
      type: object
      properties:
        audit_events:
          type: array
          items:
            $ref: '#/components/schemas/AuditResponse'

    ExportRequestResponse:
      type: object
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        expires_at:
          type: string
          format: date-time
          nullable: true

    ErasureRequestResponse:
      type: object
      properties:
        erasure_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
    BillingCheckoutRequest:
      type: object
      additionalProperties: false
      required: [price_id, locale]
      properties:
        price_id: { type: string, format: uuid }
        locale: { type: string, enum: [fa-IR, en-US] }

    HostedBillingSession:
      type: object
      required: [session_id, url, status, message_key]
      properties:
        session_id: { type: string }
        url: { type: string, format: uri, pattern: '^https://' }
        status: { type: string, const: created }
        message_key: { type: string }

    BillingPlanListResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/BillingPlan'

    BillingPlan:
      type: object
      required: [id, code, name_en, name_fa, included_athletes, entitlements, prices]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_en: { type: string }
        name_fa: { type: string }
        description_en: { type: string }
        description_fa: { type: string }
        included_athletes: { type: boolean, const: true }
        entitlements:
          type: array
          items:
            type: object
            required: [key, kind, enabled, integer_limit, label_en, label_fa]
            properties:
              key: { type: string }
              kind: { type: string, enum: [boolean, integer] }
              enabled: { type: boolean }
              integer_limit: { type: [integer, 'null'], minimum: 0 }
              label_en: { type: string }
              label_fa: { type: string }
        prices:
          type: array
          items:
            $ref: '#/components/schemas/BillingPrice'

    BillingPrice:
      type: object
      required: [id, code, currency, currency_exponent, unit_amount_minor, interval, trial_days, grace_period_days]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currency_exponent: { type: integer, minimum: 0, maximum: 4 }
        unit_amount_minor: { type: integer, minimum: 0 }
        interval: { type: string, enum: [month, year] }
        trial_days: { type: integer, minimum: 0 }
        grace_period_days: { type: integer, minimum: 0 }

    BillingWorkspaceResponse:
      type: object
      required: [organization_id, billing_account, subscription, entitlement, invoices, reconciliation_issues]
      properties:
        organization_id: { type: string, format: uuid }
        billing_account: { type: [object, 'null'] }
        subscription:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            plan_code: { type: string }
            price_id: { type: string, format: uuid }
            status: { type: string, enum: [trialing, active, past_due, incomplete, unpaid, canceled] }
            quantity: { type: integer, minimum: 1 }
            current_period_end: { type: [string, 'null'], format: date-time }
            trial_end: { type: [string, 'null'], format: date-time }
            grace_period_ends_at: { type: [string, 'null'], format: date-time }
            cancel_at_period_end: { type: boolean }
            canceled_at: { type: [string, 'null'], format: date-time }
        entitlement:
          $ref: '#/components/schemas/BillingEntitlement'
        invoices:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/BillingInvoiceSummary' }
        reconciliation_issues:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              issue_code: { type: string }
              message_key: { type: string }
              first_seen_at: { type: string, format: date-time }
              last_seen_at: { type: string, format: date-time }

    BillingEntitlement:
      type: object
      required: [access_state, athlete_access_included, features, limits, usage, reason]
      properties:
        access_state: { type: string, enum: [active, trial, grace, restricted, none] }
        athlete_access_included: { type: boolean, const: true }
        features: { type: object, additionalProperties: { type: boolean } }
        limits:
          type: object
          properties:
            staff_seats: { type: [integer, 'null'], minimum: 0 }
            active_clients: { type: [integer, 'null'], minimum: 0 }
        usage:
          type: object
          properties:
            staff_seats: { type: integer, minimum: 0 }
            active_clients: { type: integer, minimum: 0 }
        effective_until: { type: [string, 'null'], format: date-time }
        reason: { type: string }

    BillingInvoiceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currency_exponent: { type: integer, minimum: 0, maximum: 4 }
        amount_due_minor: { type: integer, minimum: 0 }
        amount_paid_minor: { type: integer, minimum: 0 }
        hosted_invoice_url: { type: [string, 'null'], format: uri }
        receipt_url: { type: [string, 'null'], format: uri }
        issued_at: { type: [string, 'null'], format: date-time }
        due_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }

    BillingAdmin:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { type: string, const: billing_admin }
        granted_at: { type: string, format: date-time }

    BillingAdminListResponse:
      type: object
      properties:
        billing_admins:
          type: array
          items: { $ref: '#/components/schemas/BillingAdmin' }

    BillingMessageResponse:
      type: object
      properties:
        status: { type: string }
        message_key: { type: string }

    BillingWebhookAcknowledgement:
      type: object
      required: [received, duplicate, event_status]
      properties:
        received: { type: boolean, const: true }
        duplicate: { type: boolean }
        event_status: { type: string, enum: [processed, ignored] }

    CopilotCapabilitiesResponse:
      type: object
      properties:
        feature:
          type: object
          properties:
            enabled:
              type: boolean
            disabled_reason:
              type: string
        policy_version:
          type: string
        provider:
          type: object
          properties:
            provider_slug:
              type: string
            provider_enabled:
              type: boolean
            model_identifier:
              type: string
        capabilities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [summarize_progress, draft_check_in, suggest_program_adjustment]
              output_schema:
                type: string
              requires_human_review:
                type: boolean
              enabled:
                type: boolean
              disabled_reason:
                type: string
              label:
                type: object
        limits:
          type: object
        prohibited_notice_key:
          type: string

    CopilotRunCreateRequest:
      type: object
      required: [capability, athlete_id, generation_language]
      properties:
        org_id:
          type: string
        capability:
          type: string
          enum: [summarize_progress, draft_check_in, suggest_program_adjustment]
        athlete_id:
          type: string
        generation_language:
          type: string
          enum: [fa-IR, en-US]
          description: Explicit. Arabic is not a supported generation language.
        parameters:
          type: object
          properties:
            period_days:
              type: integer
              minimum: 1
              maximum: 30
            notes:
              type: string
              maxLength: 500
              description: Screened server-side for prohibited intent; treated as untrusted data.
            variation:
              type: integer
              minimum: 0
        idempotency_key:
          type: string
          maxLength: 64

    CopilotRun:
      type: object
      properties:
        id:
          type: string
        capability:
          type: string
        generation_language:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, expired]
        athlete_id:
          type: string
        policy_version:
          type: string
        provider_slug:
          type: string
        model_identifier:
          type: string
        prompt_template_id:
          type: string
          nullable: true
        attempt_count:
          type: integer
        duration_ms:
          type: integer
        input_tokens_est:
          type: integer
        output_tokens_est:
          type: integer
        cost_micro_usd:
          type: integer
        error_code:
          type: string
        fallback_applied:
          type: boolean
        input_context_hash:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        regenerated_from_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
          description: Redacted, truncated, coach-inspectable input context actually used.
          properties:
            payload:
              type: object
            limitations:
              type: array
              items:
                type: string
            omissions:
              type: array
              items:
                type: string
                description: Data categories deliberately NOT included (e.g. progress_photos, body_metrics).
        output:
          $ref: '#/components/schemas/CopilotOutput'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSourceReference'
        actions:
          type: object
        ai_generated:
          type: boolean
        requires_human_review:
          type: boolean
        replayed:
          type: boolean

    CopilotOutput:
      type: object
      nullable: true
      properties:
        id:
          type: string
        schema_name:
          type: string
          enum: [ai_progress_summary.v1, ai_check_in_message.v1, ai_program_adjustment.v1]
        schema_version:
          type: integer
        validation_status:
          type: string
          enum: [valid, invalid]
        status:
          type: string
          enum: [draft, edited, approved, rejected, quarantined, expired]
        payload:
          type: object
          nullable: true
          description: Schema-validated structured draft. Null for quarantined/expired outputs.
        was_edited:
          type: boolean
        reviewed_by_id:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_note:
          type: string

    CopilotSourceReference:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        source_type:
          type: string
          enum: [workout_session, set_log, feedback_flag, program_assignment, exercise]
        source_id:
          type: string
        descriptor:
          type: string
        ordinal:
          type: integer
        record_url:
          type: string

    CopilotRunListResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/CopilotRun'
        count:
          type: integer
        retention_days:
          type: integer

    CopilotEditOutputRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: Full edited draft payload; revalidated against the capability schema.

    CopilotReviewNoteRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    CopilotReportRequest:
      type: object
      required: [report_type]
      properties:
        report_type:
          type: string
          enum: [unsafe, incorrect, privacy, hallucinated_source, other]
        detail:
          type: string
          maxLength: 1000

    CopilotReportResponse:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        report_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
