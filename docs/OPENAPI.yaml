    get:
      tags: [Messages]
      summary: List message history (participant only, bounded by join time)
      description: |
        Newest-first keyset pagination via the opaque `before` cursor. History is
        bounded by the caller's `joined_at`, so joining a conversation never grants
        retroactive access to earlier private content.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
        - name: before
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messages]
      summary: Send a text message
      description: |
        Body is Unicode-normalized, stripped of control characters, and bounded to
        2000 characters after normalization. Supplying `client_message_id` makes the
        send idempotent: a replay returns the original message with 200. A durable
        outbox event is written in the same transaction as the message.
      x-audit-event: message.sent
      x-data-sensitivity: Tier3 personal content — body never logged, audited, or placed in events
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMessageRequest' }
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '200':
          description: Idempotent replay — original message returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conversation is archived (read-only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validation failed (body_empty | body_too_long)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

