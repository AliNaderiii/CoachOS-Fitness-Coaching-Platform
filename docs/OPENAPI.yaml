          example: Great depth on set three — keep the chest tall next time.
        client_message_id:
          type: string
          maxLength: 64
          nullable: true
          description: Client-supplied idempotency key. Replaying the same value returns the original message with 200.
          example: 019a0b7c-4d21-7000-8000-2b91f0c7a410

