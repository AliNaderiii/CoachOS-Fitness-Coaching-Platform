name: CoachOS CI Quality Gates

on:
  push:
    branches:
      - main
      - "arena/**"
      - "phase/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Type & Tests (Django/DRF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff Lint & Format Check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest --cov=apps --cov=config --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint, Type & Tests (Next.js/PWA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Strict Check
        run: |
          cd frontend
          npm run type-check

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Verify Next.js Production Build
        run: |
          cd frontend
          npm run build

  security-and-governance:
    name: Security Scan & Language Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Security & Arabic Exclusion Scanner
        run: |
          bash infra/scripts/check-secrets.sh
