version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: coachos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-coachos_db}
      POSTGRES_USER: ${DB_USER:-coachos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coachos_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coachos} -d ${DB_NAME:-coachos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coachos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: coachos-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-phase04}
      - DEBUG=True
      - DATABASE_URL=postgres://${DB_USER:-coachos}:${DB_PASSWORD:-coachos_dev_pw}@db:5432/${DB_NAME:-coachos_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: coachos-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-phase04}
      - DATABASE_URL=postgres://${DB_USER:-coachos}:${DB_PASSWORD:-coachos_dev_pw}@db:5432/${DB_NAME:-coachos_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    container_name: coachos-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=CoachOS
      - NEXT_PUBLIC_DEFAULT_LOCALE=fa-IR
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
